<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WoundQuest</title><style>body{font:16px system-ui;background:#edf5f5;color:#18343d;margin:0}main{max-width:780px;margin:auto;padding:20px}section{background:white;border-radius:18px;padding:24px;margin:15px 0;box-shadow:0 5px 22px #1232}button{padding:14px;margin:6px 5px 6px 0;border:0;border-radius:12px;background:#087d81;color:white;font:inherit;cursor:pointer}button.alt{background:#e6f0f0;color:#18343d}button:disabled{opacity:.5}h1{color:#087d81}p{line-height:1.5}.note{padding:12px;background:#fff3db;border-radius:10px}.ok{background:#e4f8ed;padding:12px}.bad{background:#ffebe7;padding:12px}svg{width:100%;touch-action:none;background:#e8b9a4;border-radius:18px}label{display:block;padding:7px}textarea{width:95%;height:85px}small{color:#50646c}</style></head><body><main><h1>🩹 WoundQuest</h1><p>Interaktives Lernspiel für die Praxisanleitung · zwei fiktive Wundfälle</p><div id="app"></div><small>Didaktische Simulation, keine Behandlungsanweisung. Keine Bewohnerdaten eingeben. Bei echten Versorgungen gelten Anordnung, Hygieneplan und fachliche Standards.</small></main><script>
const cases=[{name:"Dekubitus Kategorie 3 am Kreuzbein",desc:"84-jähriger Bewohner mit eingeschränkter Mobilität. Sakrale Druckverletzung mit vollständigem Hautverlust und sichtbarem subkutanem Fettgewebe. Wundversorgung ist angeordnet.",qs:[["Welche Kategorie liegt vor?",["1","2","3","4"],2,"Kategorie 3: vollständiger Hautverlust; Fettgewebe kann sichtbar sein, Knochen und Muskeln liegen nicht frei."],["Was prüfst du vor dem Verbandwechsel?",["Nur Handschuhe","Identität, Einwilligung, Schmerzen, Anordnung und Material","Nur die Wundgröße"],1,"Sichere Vorbereitung und Händehygiene sind entscheidend."],["Was dokumentierst du?",["Nur die Kategorie","Größe, Wundgrund, Exsudat, Umgebung, Schmerzen und Veränderungen","Nur den Verband"],1,"Eine strukturierte Dokumentation ermöglicht die Verlaufsbeurteilung."],["Wie wird gereinigt?",["Immer kräftig schrubben","Nach Anordnung und Standard, gewebeschonend und aseptisch","Immer antiseptisch"],1,"Keine universelle Wischrichtung oder Reinigungslösung für alle Wunden."],["Welche zusätzliche Maßnahme ist zentral?",["Druckentlastung individuell planen","Dauerhaft auf dem Kreuzbein lagern","Nur Verbände wechseln"],0,"Druckentlastung behandelt eine wesentliche Ursache."],["Neue Rötung, Geruch und Fieber: Was nun?",["Abwarten","Eigenständig Antibiotika geben","Zeitnah fachlich/ärztlich abklären und dokumentieren"],2,"Infektionszeichen und Allgemeinsymptome erfordern zeitnahe Beurteilung."]]},{name:"Ulkus am Schienbein bei Diabetes",desc:"79-jähriger Bewohner mit Diabetes mellitus und chronischem Schienbeinulkus. Die Ursache und arterielle Durchblutung sind noch nicht vollständig geklärt.",qs:[["Was ist zur Ursache korrekt?",["Diabetes beweist ein diabetisches Ulkus","Jedes Schienbeinulkus ist venös","Arterielle, venöse, traumatische und andere Ursachen prüfen"],2,"Diabetes allein erklärt die Wundursache nicht."],["Welche Befunde sind wichtig?",["Nur Wundfarbe","Durchblutung, Pulse, Temperatur, Ödeme, Sensibilität, Schmerzen und Vorgeschichte","Nur Körpergröße"],1,"Die vaskuläre und neurologische Situation ist entscheidend."],["Kompression ohne ausreichende Gefäßabklärung?",["Sofort kräftig komprimieren","Vorher fachliche Abklärung und Anordnung sicherstellen","Nach Gefühl entscheiden"],1,"Arterielle Durchblutungsstörungen müssen berücksichtigt werden."],["Wie wählst du den Verband?",["Nach Wundbefund und gültiger Anordnung","Immer trocken halten","Beliebige Salbe nehmen"],0,"Die Versorgung richtet sich nach Wundbefund und Anordnung."],["Plötzlich kalter, blasser Fuß mit starken Schmerzen?",["Abwarten","Dringlich medizinisch abklären","Nur dicker verbinden"],1,"Akute Ischämiezeichen sind ein medizinischer Notfall."],["Was gehört in die Dokumentation?",["Nur Diabetes","Wundmaße, Gewebe, Exsudat, Umgebung, Schmerzen, Durchblutungsauffälligkeiten","Nur Datum"],1,"Dokumentiere nachvollziehbare Befunde und Maßnahmen."]]}];
const checks=["Händehygiene durchgeführt","Bewohner informiert, Schmerzen und Anordnung geprüft","Material hygienisch vorbereitet","Wunde systematisch beurteilt","Saubere und unreine Bereiche getrennt","Reinigung gemäß Standard/Anordnung durchgeführt","Verband korrekt angelegt","Material entsorgt und Händehygiene abgeschlossen","Versorgung dokumentiert"];
let s={view:"home",idx:0,q:0,answers:[],moves:0,used:false,ready:false,checks:{},note:""};const root=document.getElementById("app");
function render(){let c=cases[s.idx],h="";
if(s.view==="home")h='<section><h2>Wähle deinen Fall</h2>'+cases.map((x,i)=>'<button data-case="'+i+'">'+x.name+'</button>').join('')+'<p>Wissenstest → Finger-Simulation → Übung am Silikonmodell → Auswertung</p></section>';
if(s.view==="intro")h='<section><h2>'+c.name+'</h2><p>'+c.desc+'</p><button id="start">Fall beginnen</button></section>';
if(s.view==="quiz"){let q=c.qs[s.q],ans=s.answers[s.q];h='<section><small>Frage '+(s.q+1)+'/6 · '+s.answers.filter((a,i)=>a===c.qs[i][2]).length*10+' Punkte</small><h2>'+q[0]+'</h2>'+q[1].map((x,i)=>'<button class="alt" data-answer="'+i+'" '+(ans!==undefined?'disabled':'')+'>'+String.fromCharCode(65+i)+'. '+x+'</button>').join('')+(ans!==undefined?'<p class="'+(ans===q[2]?'ok':'bad')+'">'+(ans===q[2]?'Richtig!':'Nicht richtig.')+' '+q[3]+'</p><button id="next">'+(s.q===5?'Zur Simulation':'Weiter')+'</button>':'')+'</section>'}
if(s.view==="sim")h='<section><h2>Virtuelle Reinigungsübung</h2><p>Frische Kompresse wählen, mit dem Finger eine Bewegung über die markierte Fläche ausführen, Kompresse abwerfen. Zweimal wiederholen.</p><p class="note">Die Simulation übt Materialwechsel und das Vermeiden von Wiederverwendung. Sie kann weder Asepsis noch die fachlich richtige Wischtechnik prüfen. Diese richtet sich nach Wundbefund und Hausstandard.</p><button id="fresh">＋ Frische Kompresse</button><button id="discard" class="alt">🗑️ Abwerfen</button><svg id="wound" viewBox="0 0 500 270"><rect width="500" height="270" fill="#e8b9a4"/><path d="M120 120 Q155 50 250 88 Q340 43 389 128 Q410 215 290 214 Q169 240 120 120" fill="#a44d57" stroke="#8c3b4c" stroke-width="8"/><ellipse cx="250" cy="149" rx="86" ry="43" fill="#bd6d65"/><ellipse cx="245" cy="145" rx="45" ry="20" fill="#d9a278"/><text x="250" y="256" text-anchor="middle" font-size="14">Schematische Wundfläche</text></svg><p id="msg">Bewegungen: '+s.moves+'/2. '+(s.used?'Benutzte Kompresse abwerfen.':'Frische Kompresse wählen.')+'</p><button id="finish" '+(s.moves<2||s.used?'disabled':'')+'>Zur Praxisübung</button></section>';
if(s.view==="practice")h='<section><h2>Praxischeck am Silikonmodell</h2><p>Die Praxisanleitung beobachtet die reale Durchführung. Bitte Kriterien abhaken:</p>'+checks.map((x,i)=>'<label><input type="checkbox" data-check="'+i+'" '+(s.checks[i]?'checked':'')+'> '+x+'</label>').join('')+'<p>Reflexion (keine personenbezogenen Daten):</p><textarea id="note"></textarea><p><button id="results">Auswertung</button></p></section>';
if(s.view==="result"){let n=s.answers.filter((a,i)=>a===c.qs[i][2]).length*10;h='<section><h2>Auswertung: '+c.name+'</h2><p><strong>Theorie: '+n+'/60 Punkte</strong></p><p>Praxischeck: '+checks.filter((_,i)=>s.checks[i]).length+'/'+checks.length+' Kriterien beobachtet</p>'+checks.map((x,i)=>'<p>'+(s.checks[i]?'☑':'☐')+' '+x+'</p>').join('')+'<p>Reflexion: '+(s.note.replace(/[&<>]/g,"")||"Keine")+'</p><p class="note">Kein Zertifikat oder Freigabe zur eigenständigen Wundversorgung. Sicherheitskritische Fehler stets besprechen.</p><button onclick="window.print()">Drucken / PDF</button><button id="home">Anderen Fall wählen</button></section>'}
root.innerHTML=h;bind()}
function bind(){document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{s={view:"intro",idx:+b.dataset.case,q:0,answers:[],moves:0,used:false,ready:false,checks:{},note:""};render()});let el=id=>document.getElementById(id);if(el("start"))el("start").onclick=()=>{s.view="quiz";render()};document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{s.answers[s.q]=+b.dataset.answer;render()});if(el("next"))el("next").onclick=()=>{if(s.q===5)s.view="sim";else s.q++;render()};if(el("fresh"))el("fresh").onclick=()=>{if(s.used){el("msg").textContent="Zuerst benutzte Kompresse abwerfen.";return}s.ready=true;el("msg").textContent="Frische Kompresse bereit. Über die Wundfläche streichen."};if(el("discard"))el("discard").onclick=()=>{s.used=false;s.ready=false;el("msg").textContent="Kompresse abgeworfen. Bewegungen: "+s.moves+"/2";el("finish").disabled=s.moves<2};if(el("wound")){let svg=el("wound"),start=null;svg.onpointerdown=e=>{if(!s.ready||s.used){el("msg").textContent="Erst eine frische Kompresse wählen bzw. benutzte abwerfen.";return}let r=svg.getBoundingClientRect();start={x:(e.clientX-r.left)*500/r.width,y:(e.clientY-r.top)*270/r.height};svg.setPointerCapture(e.pointerId)};svg.onpointerup=e=>{if(!start)return;let r=svg.getBoundingClientRect(),x=(e.clientX-r.left)*500/r.width,y=(e.clientY-r.top)*270/r.height;if(Math.hypot(x-start.x,y-start.y)>35&&x>110&&x<400&&y>65&&y<225){s.moves++;s.used=true;s.ready=false;el("msg").textContent="Bewegung "+s.moves+" registriert. Kompresse abwerfen."}else el("msg").textContent="Bitte deutlich über die markierte Wundfläche streichen.";start=null}}if(el("finish"))el("finish").onclick=()=>{s.view="practice";render()};document.querySelectorAll('[data-check]').forEach(b=>b.onchange=()=>s.checks[+b.dataset.check]=b.checked);if(el("note"))el("note").oninput=e=>s.note=e.target.value;if(el("results"))el("results").onclick=()=>{s.view="result";render()};if(el("home"))el("home").onclick=()=>{s.view="home";render()}}render();
</script></body></html>
